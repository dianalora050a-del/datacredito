
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso a suscriptores - Maqueta</title>

<style>
/* CONTENIDO PRINCIPAL */
.main {
    min-height: 680px;
}

/* PANEL IZQUIERDO */
.left {
    min-height: 680px;
}

.abstract {
    transform: scale(.85);
    transform-origin: top left;
}

.people {
    height: 330px;
}

.person {
    width: 125px;
    height: 235px;
}

.person:nth-child(2) {
    height: 270px;
}

.person:nth-child(3) {
    height: 235px;
}

/* PANEL DERECHO */
.right {
    padding: 30px 30px;
}

.login {
    max-width: 400px;
}

.logo {
    font-size: 19px;
    margin-bottom: 23px;
}

h1 {
    font-size: 34px;
}

.subtitle {
    font-size: 18px;
    margin-bottom: 38px;
}

.form-group {
    margin-bottom: 13px;
}

select,
.form-input {
    height: 49px;
    font-size: 15px;
}

.captcha-area {
    margin-top: 15px;
    margin-bottom: 19px;
}

.glyph {
    grid-template-columns: repeat(5, 3px);
    grid-template-rows: repeat(7, 3px);
    gap: 2px;
}

.dot {
    width: 3px;
    height: 3px;
}

.captcha {
    gap: 6px;
}

.forgot {
    margin: 18px 0 34px;
}

.terms {
    margin-bottom: 17px;
}

.terms label {
    margin-bottom: 13px;
    font-size: 13px;
}

.login-button {
    width: 175px;
    height: 45px;
    font-size: 15px;
}

/* PIE DE PÁGINA */
.footer {
    min-height: 85px;
    padding: 15px 25px;
}

.footer-content {
    max-width: 1150px;
}

.copyright {
    font-size: 13px;
}

/* MÓVIL */
@media(max-width: 850px) {
    .main {
        min-height: auto;
    }

    .right {
        min-height: calc(100vh - 85px);
        padding: 28px 20px;
    }

    h1 {
        font-size: 28px;
    }

    .subtitle {
        font-size: 16px;
        margin-bottom: 32px;
    }

    .footer {
        min-height: auto;
    }
}

</style>
</head>

<body>

<div class="page">

    <main class="main">

        <!-- IZQUIERDA -->
        <section class="left">
            <div class="abstract"></div>

            <div class="people">
                <div class="person"></div>
                <div class="person"></div>
                <div class="person"></div>
            </div>
        </section>

        <!-- DERECHA -->
        <section class="right">

            <div class="login">

                <div class="logo">
                    <div class="logo-icon">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    Portal de consulta
                </div>

                <h1>Acceso a suscriptores</h1>
                <p class="subtitle">
                    Ingrese sus datos para continuar
                </p>

                <form id="demoForm">

                    <div class="form-group">
                        <select>
                            <option>Cédula o NUIP</option>
                            <option>Cédula de ciudadanía</option>
                            <option>Cédula de extranjería</option>
                            <option>NIT</option>
                            <option>Pasaporte</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <input class="form-input"
                               type="text"
                               placeholder="Número de ID"
                               maxlength="20">
                    </div>

                    <div class="form-group">
                        <input class="form-input"
                               type="password"
                               placeholder="Contraseña"
                               maxlength="50">
                    </div>

                    <div class="form-group">
                        <input class="form-input"
                               type="text"
                               placeholder="Ingresa las letras que aparecen en el recuadro inferior"
                               maxlength="8">
                    </div>

                    <!-- CAPTCHA -->
                    <div class="captcha-area">

                        <div class="captcha" id="captcha"></div>

                        <button type="button"
                                class="refresh"
                                id="refresh">
                            Click para cambiar
                        </button>

                    </div>

                    <a href="#" class="forgot" id="forgot">
                        ¿Olvidó su contraseña?
                    </a>

                    <!-- CONDICIONES -->
                    <div class="terms">

                        <label>
                            <input type="checkbox">
                            <span>
                                He leído y acepto
                                <a href="#">Condiciones de uso</a>
                            </span>
                        </label>

                        <label>
                            <input type="checkbox">
                            <span>
                                He leído y acepto
                                <a href="#">Políticas de privacidad</a>
                            </span>
                        </label>

                    </div>

                    <button class="login-button" type="submit">
                        Ingresar
                    </button>

                    <p style="font-size:11px;color:#888;margin-top:15px">
                        Maqueta de demostración. No se transmiten datos.
                    </p>

                </form>

            </div>
        </section>

    </main>

    <!-- PIE DE PÁGINA COMPLETO -->
    <footer class="footer">

        <div class="footer-content">

            <div class="copyright">
                ©2016 Portal de consulta. Todos los derechos
                reservados.
            </div>

            <a href="#" class="footer-link">
                Condiciones de uso
            </a>

            <div class="footer-extra">
                Maqueta visual de demostración
            </div>

        </div>

    </footer>

</div>

<script>
// Matrices de letras para el CAPTCHA visual
const letters = {
    A:["01110","10001","10001","11111","10001","10001","10001"],
    B:["11110","10001","10001","11110","10001","10001","11110"],
    C:["01111","10000","10000","10000","10000","10000","01111"],
    D:["11110","10001","10001","10001","10001","10001","11110"],
    E:["11111","10000","10000","11110","10000","10000","11111"],
    F:["11111","10000","10000","11110","10000","10000","10000"],
    G:["01111","10000","10000","10111","10001","10001","01111"],
    H:["10001","10001","10001","11111","10001","10001","10001"],
    I:["11111","00100","00100","00100","00100","00100","11111"],
    J:["00111","00010","00010","00010","00010","10010","01100"],
    K:["10001","10010","10100","11000","10100","10010","10001"],
    L:["10000","10000","10000","10000","10000","10000","11111"],
    M:["10001","11011","10101","10101","10001","10001","10001"],
    N:["10001","11001","10101","10011","10001","10001","10001"],
    O:["01110","10001","10001","10001","10001","10001","01110"],
    P:["11110","10001","10001","11110","10000","10000","10000"],
    R:["11110","10001","10001","11110","10100","10010","10001"],
    S:["01111","10000","10000","01110","00001","00001","11110"],
    T:["11111","00100","00100","00100","00100","00100","00100"],
    U:["10001","10001","10001","10001","10001","10001","01110"],
    V:["10001","10001","10001","10001","10001","01010","00100"]
};

const captcha = document.getElementById("captcha");

function renderCaptcha() {

    const chars = ["F","T","B","E","R","P"];
    const code = [];

    for(let i = 0; i < 6; i++) {
        const letter = chars[Math.floor(Math.random() * chars.length)];
        code.push(letter);
    }

    captcha.innerHTML = "";

    code.forEach(letter => {

        const glyph = document.createElement("div");
        glyph.className = "glyph";

        const matrix = letters[letter];

        matrix.forEach(row => {

            row.split("").forEach(pixel => {

                const dot = document.createElement("span");

                dot.className = pixel === "1"
                    ? "dot"
                    : "dot off";

                glyph.appendChild(dot);

            });

        });

        captcha.appendChild(glyph);

    });
}

// Inicializar y cambiar captcha
renderCaptcha();

document.getElementById("refresh").addEventListener("click", renderCaptcha);

// Demostración local
document.getElementById("demoForm").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Esta es una maqueta visual. No se ha enviado ni guardado información.");
});

document.getElementById("forgot").addEventListener("click", function(e) {
    e.preventDefault();
    alert("Recuperación de contraseña: demostración.");
});
</script>

</body>
</html>
